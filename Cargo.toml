[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/lippdev/tako-launcher"
rust-version = "1.97"

[workspace.dependencies]
tako-core = { path = "crates/tako-core" }
tako-sources = { path = "crates/tako-sources" }
tako-platform = { path = "crates/tako-platform" }
tako-themes = { path = "crates/tako-themes" }
tako-ui = { path = "crates/tako-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
plist = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
keyring = "4"
tempfile = "3"
insta = "1"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2"] }
slint-interpreter = { version = "1.18.1", default-features = false, features = ["backend-default", "renderer-femtovg", "renderer-software", "compat-1-2"] }
sdl3 = { version = "0.20.0", features = ["build-from-source-static"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
