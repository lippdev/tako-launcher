# Política mínima de dependências (DL-001, ADR-0028): só licenças compatíveis com a AGPL-3.0-only (ADR-0014).
# Rodar: `cargo deny check licenses`.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
]
private = { ignore = true }
