[package]
name = "tako"
description = "Launcher de jogos para a TV e o controle, igual no Windows, no Linux e no macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
web = ["dep:tako-web", "tako-web/cef"]

[dependencies]
tako-core.workspace = true
tako-platform.workspace = true
tako-sources.workspace = true
tako-themes.workspace = true
tako-app.workspace = true
tako-ui.workspace = true
tako-web = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
slint.workspace = true
chrono.workspace = true

[dev-dependencies]

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
