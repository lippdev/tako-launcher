[package]
name = "tako-platform"
description = "Funções de plataforma do Tako (telas, áudio, cursor, processos, segredos) por SO."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tako-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
keyring.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Dwm"] }
windows-core.workspace = true
windows-registry.workspace = true
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
zbus.workspace = true
evdev.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-audio.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true

[lints.rust]
# `unsafe` só é permitido aqui (PRD §5.1); cada bloco tem `// SAFETY:`.
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
