[session.screen]
not_connected = "the chosen game screen is not connected"
none_chosen = "choose the game screen in Settings"
no_hdr = "HDR is not available on {screen}"
did_not_wake = "{screen} did not turn on"
read_failed = "could not read the displays"
already_active = "the game screen is already in focus"
managed = "the resolution is set by the session (gamescope)"

[session.exit]
code = "Exit code {code}"
dll_not_found = "a DLL the game needs was not found (install Visual C++ and DirectX, or repair the game files)"
entry_point = "one of the game's DLLs is a different version (update Visual C++ and DirectX, or repair the game files)"
dll_init = "a DLL failed to start (reinstall Visual C++ and DirectX; antivirus software or overlays can also cause this)"
access_violation = "the game accessed memory it shouldn't and crashed (mods, overlays, the graphics driver or corrupted files)"
bad_image = "the game or a DLL is built for another architecture, for example a 32-bit DLL in a 64-bit game (reinstall Visual C++ x86 and x64 or repair the files)"
illegal_instruction = "the processor lacks an instruction the game requires (for example, AVX)"
stack_overflow = "the game crashed with a stack overflow (a bug in the game or a mod)"
heap_corruption = "the game corrupted its own memory and crashed (often caused by mods or overlays)"
fail_fast = "the game hit a serious error and closed itself (mods, overlays or corrupted files)"
no_memory = "the game ran out of memory"
