name: Rust

# Tako em Rust (PRD §4 e §8.4): fmt, licenças, clippy e testes. Só Windows durante a alpha (PRD D-20: Linux e macOS
# pausados até a Fase 6; o benchmark no Linux e a matriz dos três SOs estão no histórico do git). Os testes são locais
# (PRD D-13): só roda quando alguém pede.
on:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  deny:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Gerar MSIX FSE assinado
        shell: powershell
        run: |
          ./build/rust/Package-Fse.ps1 -OutputDirectory "$env:RUNNER_TEMP/fse"
          "TAKO_FSE_PAYLOAD_DIR=$env:RUNNER_TEMP/fse" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # Isolado: Windows Server do runner pode não oferecer a capability gamingHome.
  fse-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar MSIX FSE assinado
        shell: powershell
        run: ./build/rust/Package-Fse.ps1 -OutputDirectory "$env:RUNNER_TEMP/fse"
      - name: Validar estado e recuperação do FSE
        shell: powershell
        run: ./crates/tako-platform/tests/fse-state.ps1
      - name: Validar instalação e restauração reais
        shell: powershell
        run: ./crates/tako-platform/tests/fse-integration.ps1 -PayloadDirectory "$env:RUNNER_TEMP/fse"
