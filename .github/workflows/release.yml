name: Release
# Pré-releases de teste (ex.: v0.1.0-alpha.1) e releases: compila no Windows, roda os testes e publica instalador,
# portable e kit FSE na página da release (pacotes gerados por packaging/build-packages.ps1).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Testes
        run: |
          dotnet restore --locked-mode
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --filter-not-trait "Category=Hardware" --ignore-exit-code 8
      - name: Pacotes
        shell: pwsh
        run: ./packaging/build-packages.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v')) -OutDir "$env:RUNNER_TEMP/out"
      - name: Criar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $out = "$env:RUNNER_TEMP/out"
          $flags = @()
          if ($tag -match '-') { $flags += '--prerelease' }
          gh release create $tag "$out/Tako-$version-Setup-x64.exe" "$out/Tako-$version-Portable-x64.zip" "$out/Tako-FseKit-$version-win-x64.zip" `
            --title "Tako $version" --notes-file packaging/release/NOTES.md --verify-tag @flags
