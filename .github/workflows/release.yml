name: Release

# Quando sai cada release (regras em build/resolve-release.sh; versão com hífen é pré-release):
#  - Push na main: estável, com a versão da primeira seção "## [X.Y.Z]" do CHANGELOG.md. Se o topo for pré-release ou a
#    tag já existir, o workflow para no "resolve" e nada é publicado.
#  - Actions > Release > Run workflow na develop, canal alpha ou beta: a pré-release sai com o próximo número
#    (0.2.0-alpha.3, 0.2.0-beta.1...). Notas da seção da versão ou, sem ela, da [Unreleased].
#  - Run workflow em outra branch, com "publish" desmarcado: só compila e guarda os arquivos como artefato.
# Plataformas: Windows sempre. Linux (deb, AppImage, tar.gz; x64 e arm64) e macOS (dmg e zip; Apple Silicon e Intel)
# só quando existir a variável do repositório TAKO_UNIX_PROJECT com o .csproj de um front-end multiplataforma (a UI
# atual é WPF). Para testar o empacotamento antes disso, informe "unix_project" ao rodar à mão sem publicar.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel: alpha or beta (from develop), stable (from main)."
        type: choice
        options: [alpha, beta, stable]
        default: alpha
      base_version:
        description: "Optional X.Y.Z for alpha/beta. Empty = top of CHANGELOG.md (next patch if it already shipped)."
        required: false
      publish:
        description: "Publish: create the tag and the GitHub release. Unticked, just build."
        type: boolean
        default: true
      unix_project:
        description: "Optional .csproj to package for Linux/macOS (overrides TAKO_UNIX_PROJECT; only without publish)."
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      unix_project: ${{ steps.unix.outputs.project }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CHANNEL: ${{ github.event_name == 'push' && 'stable' || github.event.inputs.channel }}
          BASE_VERSION: ${{ github.event.inputs.base_version }}
          PUBLISH: ${{ github.event.inputs.publish }}
        run: build/resolve-release.sh

      - name: Linux/macOS project
        id: unix
        env:
          INPUT_PROJECT: ${{ github.event.inputs.unix_project }}
          VAR_PROJECT: ${{ vars.TAKO_UNIX_PROJECT }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          project="$VAR_PROJECT"
          if [[ -n "$INPUT_PROJECT" ]]; then
            [[ "$PUBLISH" == "true" ]] && { echo "::error::unix_project só vale sem publish (teste do empacotamento)."; exit 1; }
            project="$INPUT_PROJECT"
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          [[ -n "$project" ]] && echo "Linux/macOS: $project" || echo "Linux/macOS: desligado (sem TAKO_UNIX_PROJECT)"

      - name: Summary
        env:
          BUILD: ${{ steps.version.outputs.build }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          VERSION: ${{ steps.version.outputs.version }}
          REASON: ${{ steps.version.outputs.reason }}
          UNIX: ${{ steps.unix.outputs.project }}
        run: |
          {
            if [[ "$BUILD" != "true" ]]; then
              echo "### Nenhuma release"; echo; echo "$REASON"
            else
              echo "### Tako $VERSION"; echo
              echo "- Publicar: $PUBLISH"
              echo "- Linux/macOS: ${UNIX:-desligado (sem TAKO_UNIX_PROJECT)}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes
        if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  windows:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run tests
        shell: pwsh
        run: |
          dotnet restore --locked-mode
          dotnet test -c Release --filter-not-trait "Category=Hardware" --ignore-exit-code 8

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # ScreenScraper (ADR-0022): credenciais do software, pedidas pelos mantenedores ao ScreenScraper. Crie em
      # Settings > Secrets and variables > Actions os segredos SCREENSCRAPER_DEVID e SCREENSCRAPER_DEVPASSWORD (e, se o
      # ScreenScraper registrar outro nome de software, SCREENSCRAPER_SOFTNAME; o padrão é "Tako"). Sem eles, a release
      # sai sem acesso ao ScreenScraper e o Tako mostra isso nas Configurações. Só este passo os recebe (nunca o CI de PR).
      - name: Build portable + installer
        shell: pwsh
        env:
          SCREENSCRAPER_DEVID: ${{ secrets.SCREENSCRAPER_DEVID }}
          SCREENSCRAPER_DEVPASSWORD: ${{ secrets.SCREENSCRAPER_DEVPASSWORD }}
          SCREENSCRAPER_SOFTNAME: ${{ secrets.SCREENSCRAPER_SOFTNAME }}
        run: .\build\Publish-Tako.ps1 -Runtime x64 -Target All -Version "${{ needs.resolve.outputs.version }}"

      # Assinatura de código (como no Console Mode). Desligada até existirem as variáveis do SignPath no repositório:
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG e o segredo SIGNPATH_API_TOKEN.
      - name: Upload unsigned build for signing
        id: unsigned
        if: needs.resolve.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ needs.resolve.outputs.version }}
          path: |
            dist/Tako-Setup-x64.exe
            dist/Tako-Portable-x64.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: needs.resolve.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      - name: Use the signed files
        if: needs.resolve.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($name in "Tako-Setup-x64.exe", "Tako-Portable-x64.exe") {
            $signed = Join-Path "dist-signed" $name
            if (-not (Test-Path -LiteralPath $signed)) { throw "SignPath did not return $name" }
            if ((Get-AuthenticodeSignature -LiteralPath $signed).Status -ne "Valid") { throw "$name is not validly signed" }
            Copy-Item -LiteralPath $signed -Destination (Join-Path "dist" $name) -Force
          }

      # O kit do experimento FSE acompanha as releases enquanto o spike MVP-007 estiver aberto.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tako-${{ needs.resolve.outputs.version }}-windows
          path: |
            dist/Tako-Setup-x64.exe
            dist/Tako-Portable-x64.exe
            dist/Tako-FseKit-x64.zip
          if-no-files-found: error

  unix:
    needs: resolve
    if: needs.resolve.outputs.build == 'true' && needs.resolve.outputs.unix_project != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: osx-arm64, runner: macos-latest } # Apple Silicon
          - { rid: osx-x64, runner: macos-latest } # Intel (compilado no runner Apple Silicon)
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build packages
        env:
          TAKO_UNIX_PROJECT: ${{ needs.resolve.outputs.unix_project }}
          TAKO_UNIX_FRAMEWORK: ${{ vars.TAKO_UNIX_FRAMEWORK }}
          TAKO_UNIX_EXECUTABLE: ${{ vars.TAKO_UNIX_EXECUTABLE }}
        run: build/publish-unix.sh "${{ matrix.rid }}" "${{ needs.resolve.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tako-${{ needs.resolve.outputs.version }}-${{ matrix.rid }}
          path: dist/Tako-*
          if-no-files-found: error

  publish:
    needs: [resolve, windows, unix]
    # "unix" pulado (sem front-end multiplataforma) não impede a release; falhar, sim.
    if: >-
      always() && needs.resolve.outputs.publish == 'true' && needs.windows.result == 'success'
      && (needs.unix.result == 'success' || needs.unix.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Só os artefatos finais: o "unsigned-*" (entrada do SignPath) tem os mesmos nomes e não pode sobrescrevê-los.
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: Tako-${{ needs.resolve.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist

      - name: Release notes with downloads
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # crases literais (Markdown).
          describe() {
            case "$1" in
              Tako-Setup-*.exe) echo 'installs the app for your user (no admin), with a Start menu shortcut and an optional desktop shortcut.' ;;
              Tako-Portable-*.exe) echo 'a single executable; keeps its data in the `Tako_Data` folder next to the file.' ;;
              Tako-FseKit-*.zip) echo 'kit for the Xbox full screen experience experiment (MVP-007).' ;;
              *.deb) echo 'package for Debian, Ubuntu and derivatives (`sudo apt install ./file.deb`).' ;;
              *.AppImage) echo 'runs on most Linux distributions without installing (`chmod +x`, then open it).' ;;
              *.tar.gz) echo 'the app folder, to extract anywhere.' ;;
              *.dmg) echo 'drag Tako to Applications.' ;;
              Tako-macOS-*.zip) echo 'the app bundle, zipped.' ;;
            esac
          }
          # shellcheck disable=SC2086 # $2 é uma lista de globs, expandida de propósito.
          section() {
            local files; files="$(cd dist && for p in $2; do ls -1 $p 2>/dev/null; done || true)"
            [[ -z "$files" ]] && return
            echo "**$1**"; echo
            while read -r f; do echo "- \`$f\` — $(describe "$f")"; done <<< "$files"
            echo
          }
          notes="$(cat dist/release-notes.md)"
          rm dist/release-notes.md
          {
            printf '%s\n' "${notes%%$'\n---\n'*}"
            echo "### Downloads"; echo
            section "Windows" "Tako-Setup-* Tako-Portable-* Tako-FseKit-*"
            section "Linux (x64 = Intel/AMD, arm64 = ARM)" "Tako-Linux-*"
            section "macOS (arm64 = Apple Silicon, x64 = Intel)" "Tako-macOS-*"
            echo "---"; echo
            printf '%s\n' "${notes##*$'\n---\n\n'}"
          } > release-notes.md
          cat release-notes.md
          ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # A tag é criada aqui, no commit que foi compilado.
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Tako ${{ needs.resolve.outputs.version }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          make_latest: ${{ needs.resolve.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: release-notes.md
          files: dist/Tako-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Abre o PR de atualização no microsoft/winget-pkgs para releases estáveis (pré-releases ficam de fora).
  # Desligado até existir o segredo WINGET_TOKEN: um PAT clássico com escopo public_repo da conta dona do fork de winget-pkgs.
  winget:
    needs: [resolve, publish]
    if: needs.publish.result == 'success' && needs.resolve.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: lippdev.Tako
          release-tag: ${{ needs.resolve.outputs.tag }}
          installers-regex: 'Tako-Setup-x64\.exe$'
          fork-user: lippdev
          token: ${{ env.WINGET_TOKEN }}
