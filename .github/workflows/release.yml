name: Release

# Mesmo processo do Console Mode. Duas formas de publicar (versão com hífen, como 0.1.0-alpha.5, é pré-release):
#  - Actions > Release > Run workflow na main, com a versão e "publish" marcado: a tag e a release são criadas aqui.
#  - Push de uma tag como v0.1.0 (estável) ou v0.1.0-alpha.5 (pré-release).
# Com "publish" desmarcado, o workflow só compila e envia os arquivos como artefato.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0-alpha.5). A hyphen makes it a pre-release."
        required: true
      publish:
        description: "Publish: create the tag and the GitHub release (only from main). Unticked, just build."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          $v = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME } else { $env:INPUT_VERSION }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Versão inválida: $v" }
          $publish = ($env:EVENT_NAME -eq "push") -or ($env:INPUT_PUBLISH -eq "true")
          if ($publish -and $env:EVENT_NAME -ne "push") {
            # Publicar à mão cria a tag aqui: só a partir da main, e nunca por cima de uma tag existente.
            if ($env:REF -ne "refs/heads/main") { throw "Só dá para publicar a partir da main (rodando em $($env:REF))." }
            if (git ls-remote --tags origin "refs/tags/v$v") { throw "A tag v$v já existe." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes (English, with a link to the Portuguese changelog)
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          function Get-Notes([string]$file) {
            $changelog = Get-Content -LiteralPath $file -Raw -Encoding utf8
            $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\]\r?\n(?<notes>.*?)(?=^## \[|\z)"
            $match = [regex]::Match($changelog, $pattern)
            if (-not $match.Success) { throw "$file precisa conter a seção ## [$($env:VERSION)]." }
            $notes = $match.Groups["notes"].Value.Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) { throw "A seção $($env:VERSION) de $file está vazia." }
            return $notes
          }
          # Os dois changelogs precisam da seção; o português vai como link, não colado.
          $null = Get-Notes "CHANGELOG.md"
          $en = Get-Notes "CHANGELOG.en-US.md"
          $tag = "v$($env:VERSION)"
          $releaseNotes = @(
            $en
            ""
            "### Downloads"
            ""
            # Aspas simples: em strings com aspas duplas do pwsh a crase é escape e os trechos de código do Markdown somem.
            '- **Installer:** `Tako-Setup-x64.exe` — installs the app for your user (no admin), with a Start menu shortcut and an optional desktop shortcut.'
            '- **Portable:** `Tako-Portable-x64.exe` — a single executable; keeps its data in the `Tako_Data` folder next to the file.'
            ""
            "---"
            ""
            "🇧🇷 Notas em português: [CHANGELOG.md](https://github.com/lippdev/ultralauncher/blob/$tag/CHANGELOG.md)"
          ) -join "`n"
          Set-Content -LiteralPath "release-notes.md" -Value $releaseNotes -Encoding utf8

      - name: Run tests
        shell: pwsh
        run: |
          dotnet restore --locked-mode
          dotnet test -c Release --filter-not-trait "Category=Hardware" --ignore-exit-code 8

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build portable + installer
        shell: pwsh
        run: .\build\Publish-Tako.ps1 -Runtime x64 -Target All -Version "${{ steps.version.outputs.version }}"

      # Assinatura de código (como no Console Mode). Desligada até existirem as variáveis do SignPath no repositório:
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG e o segredo SIGNPATH_API_TOKEN.
      - name: Upload unsigned build for signing
        id: unsigned
        if: steps.version.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ steps.version.outputs.version }}
          path: |
            dist/Tako-Setup-x64.exe
            dist/Tako-Portable-x64.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.version.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      - name: Use the signed files
        if: steps.version.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($name in "Tako-Setup-x64.exe", "Tako-Portable-x64.exe") {
            $signed = Join-Path "dist-signed" $name
            if (-not (Test-Path -LiteralPath $signed)) { throw "SignPath did not return $name" }
            if ((Get-AuthenticodeSignature -LiteralPath $signed).Status -ne "Valid") { throw "$name is not validly signed" }
            Copy-Item -LiteralPath $signed -Destination (Join-Path "dist" $name) -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tako-${{ steps.version.outputs.version }}
          path: |
            dist/Tako-Setup-x64.exe
            dist/Tako-Portable-x64.exe
            dist/Tako-FseKit-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          # Tag enviada: já existe. Rodado à mão: é criada aqui, no commit que foi compilado.
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Tako ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          body_path: release-notes.md
          # O kit do experimento FSE acompanha as releases enquanto o spike MVP-007 estiver aberto.
          files: |
            dist/Tako-Setup-x64.exe
            dist/Tako-Portable-x64.exe
            dist/Tako-FseKit-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Abre o PR de atualização no microsoft/winget-pkgs para releases estáveis (pré-releases ficam de fora).
  # Desligado até existir o segredo WINGET_TOKEN: um PAT clássico com escopo public_repo da conta dona do fork de winget-pkgs.
  winget:
    needs: build
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: lippdev.Tako
          release-tag: v${{ needs.build.outputs.version }}
          installers-regex: 'Tako-Setup-x64\.exe$'
          fork-user: lippdev
          token: ${{ env.WINGET_TOKEN }}
