name: CI
# Testes são locais durante a migração para a interface web (PRD D-13): só roda quando alguém pede.
on:
  workflow_dispatch:
jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
