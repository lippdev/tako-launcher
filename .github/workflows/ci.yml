name: CI
# Roda só onde ajuda o desenvolvimento:
#  - PR para develop/main que mexe em código (só docs, design e imagens não rodam) e não está em rascunho;
#  - um push novo na PR cancela a execução anterior;
#  - sem execução no push para develop/main (a PR já testou; o push na main roda o workflow de release);
#  - pacote (instalador + portable) só em PR para a main ou com o label "package";
#  - benchmark só com o label "benchmark" ou rodando à mão (Actions > CI > Run workflow).
# O título da PR é conferido em pr-title.yml, que roda também nas PRs só de docs.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - "logo/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Also run the benchmark"
        type: boolean
        default: false
      package:
        description: "Also build the installer and portable"
        type: boolean
        default: false

concurrency:
  # Adicionar um label não cancela a execução do código em andamento. Uma PR aberta já com label recebe também o evento
  # "labeled"; por isso, no "opened", os jobs por label esperam esse evento em vez de rodar duas vezes.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'labeled' && !github.event.pull_request.draft)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      # --ignore-exit-code 8: projetos de teste ainda sem testes (remover quando todos tiverem).
      - run: dotnet test --no-build -c Release --filter-not-trait "Category=Hardware" --ignore-exit-code 8
      # Capturas do teste de fumaça da UI (cada tela renderizada pelo WPF real).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: tests/Launcher.UI.Wpf.Tests/bin/Release/**/screenshots/
          if-no-files-found: ignore
  # Instalador e portable (mesmo script da release) antes de chegar à main: a release não quebra na hora de publicar.
  package:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.package)
      || (github.event_name == 'pull_request' && !github.event.pull_request.draft && (
        (github.event.action != 'labeled' && (github.base_ref == 'main' || (github.event.action != 'opened' && contains(github.event.pull_request.labels.*.name, 'package'))))
        || (github.event.action == 'labeled' && github.event.label.name == 'package')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build portable + installer
        shell: pwsh
        run: .\build\Publish-Tako.ps1 -Runtime x64 -Target All -Version "0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Tako-ci-${{ github.run_number }}
          path: |
            dist/Tako-Setup-x64.exe
            dist/Tako-Portable-x64.exe
          if-no-files-found: error
          retention-days: 7
  # Benchmark (MVP-035, frente G): números vão para o artefato "benchmark" e o resumo do job. Runners variam, então
  # nenhum número reprova; só reprova se o Tako travar, quebrar ou não chegar à tela interativa.
  benchmark:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.benchmark)
      || (github.event_name == 'pull_request' && !github.event.pull_request.draft && (
        (github.event.action != 'labeled' && github.event.action != 'opened' && contains(github.event.pull_request.labels.*.name, 'benchmark'))
        || (github.event.action == 'labeled' && github.event.label.name == 'benchmark')))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore tools/Launcher.Bench --locked-mode
      - run: dotnet build tools/Launcher.Bench --no-restore -c Release
      - name: Run benchmark
        shell: pwsh
        env:
          TAKO_BENCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          & tools/Launcher.Bench/bin/Release/net10.0-windows/Launcher.Bench.exe --out "$env:RUNNER_TEMP/benchmark" --label "GitHub Actions windows-latest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP/benchmark/benchmark.md" | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            ${{ runner.temp }}/benchmark/benchmark.json
            ${{ runner.temp }}/benchmark/benchmark.md
            ${{ runner.temp }}/benchmark/runs/
          if-no-files-found: ignore
